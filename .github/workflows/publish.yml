name: Publish to PyPI

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and verify without uploading to PyPI)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/broodminder-data
    permissions:
      contents: write
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check package version and release status
        id: check_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python scripts/pypi_onboard.py --version)
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not extract version from pyproject.toml"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "Package version: ${VERSION} (${TAG})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "Triggered manually via workflow_dispatch."
          elif [ "${EVENT_NAME}" = "release" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "Triggered via published release ${TAG}."
          elif [ "${EVENT_NAME}" = "push" ]; then
            git fetch --tags origin || true
            if git rev-parse "${TAG}" >/dev/null 2>&1 || gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists. Version ${VERSION} is already published or tagged."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "create_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "New version ${VERSION} detected on main without git tag ${TAG}."
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "create_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine

      - name: Build sdist and wheel
        if: steps.check_version.outputs.should_publish == 'true'
        run: python -m build

      - name: Verify package metadata with twine
        if: steps.check_version.outputs.should_publish == 'true'
        run: twine check --strict dist/*

      - name: Dry-run verification
        if: steps.check_version.outputs.should_publish == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "=== DRY RUN: Artifacts built and verified successfully ==="
          ls -la dist/
          echo "Package is verified and ready for PyPI publication."

      - name: Publish package distributions to PyPI
        if: steps.check_version.outputs.should_publish == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: true

      - name: Create GitHub Release and git tag
        if: steps.check_version.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check_version.outputs.tag }}
          VERSION: ${{ steps.check_version.outputs.version }}
        run: |
          echo "Creating GitHub Release ${TAG}..."
          gh release create "${TAG}" \
            --title "v${VERSION}" \
            --generate-notes \
            --target "${{ github.sha }}"
          echo "GitHub Release ${TAG} created successfully."
