# SonarCloud config for petry-projects/broodminder-data (Python).
# projectKey points at the live SonarCloud project (petry-projects_broodminder-export2);
sonar.projectKey=petry-projects_broodminder-export2
sonar.projectName=broodminder-data
sonar.organization=petry-projects
sonar.sources=bm,scripts
sonar.tests=tests
sonar.python.version=3.10,3.12,3.13
sonar.exclusions=**/.venv/**,**/data/**,**/__pycache__/**
sonar.python.coverage.reportPaths=coverage.xml
